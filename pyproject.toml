[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boe_var"
version = "0.1.0"
description = "Python replication of BoE Macro Technical Paper No. 3: A structural VAR model for the UK economy (Brignone & Piffer, 2025)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vahid Ahmadi", email = "va.vahidahmadi@gmail.com" }]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boe_var = ["_data/*.csv", "_results/*.md"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
markers = [
    "slow: high-draw / importance-weighted validation (~minutes); run with --runslow",
    "calibration: Monte-Carlo FEVD-share magnitudes vs the paper (report-only, not a hard gate)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
# E741: single-letter lag index `l` is idiomatic throughout the VAR code
# (`for l in range(1, p + 1)`), matching the paper's notation.
ignore = ["E741"]
