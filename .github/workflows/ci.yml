name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual / scheduled trigger for the expensive high-draw, importance-weighted
  # validation (the `slow` marker), which is skipped on every PR/push.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff check src tests

  tests:
    name: Fast tests (paper invariants + stress) -- HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      # HARD GATE: the Table 2 structural sign/zero restriction invariants
      # (tests/test_validation.py) and the numerical stress suite
      # (tests/test_stress.py). Excludes `calibration` (Monte-Carlo FEVD-share
      # magnitudes -- report-only below) and `slow` (the weighted high-draw
      # benchmark, run weekly/on-demand in slow-validation).
      - name: Fast structural + stress tests
        run: uv run pytest -q -m "not calibration and not slow"

  calibration-report:
    name: Calibration report (FEVD shares) -- REPORT ONLY
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      # REPORT ONLY: Monte-Carlo FEVD-share magnitudes drift with sampling and
      # are a known-soft calibration target, so a benign move must not red the
      # build. continue-on-error keeps this informational, matching the OBR
      # emulator's calibration-report policy.
      - name: Calibration tests (non-gating)
        continue-on-error: true
        run: uv run pytest -q -m "calibration and not slow"

  slow-validation:
    name: Slow validation (high-draw, weighted) -- REPORT ONLY
    # Only on manual dispatch or the weekly schedule -- never on PRs/pushes.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      # The weighted high-draw benchmark is a calibration target (report-only):
      # it is the definitive FEVD-share check, but Monte-Carlo drift must not
      # red the scheduled build.
      - name: Slow tests (non-gating)
        continue-on-error: true
        run: uv run pytest -q --runslow -m slow
