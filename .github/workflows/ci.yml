name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual / nightly trigger for the expensive high-draw, importance-weighted
  # validation (the `slow` marker), which is skipped on every PR/push.
  workflow_dispatch:
  schedule:
    # Nightly, so drift in the heavy weighted validation is caught within a day
    # rather than up to a week later.
    - cron: "0 6 * * *"   # every day 06:00 UTC

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff check src tests

  tests:
    name: Fast tests (paper invariants + stress) -- HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      # HARD GATE -- the paper-published invariants, which must never regress:
      #   1. zero restrictions hold on EVERY accepted draw
      #   2. sign restrictions hold on EVERY accepted draw
      #   3. FEVD shares sum to 1 (and each lies in [0, 1]) on EVERY draw
      #   4. the historical decomposition reconstructs the observed data on
      #      EVERY accepted draw
      #   plus the global FEVD shares sitting inside the paper's stated band,
      #   and the numerical stress suite (tests/test_stress.py).
      # Excludes only `slow` (the weighted high-draw *magnitude* benchmark,
      # re-run nightly in slow-validation) and `calibration` (Monte-Carlo
      # magnitudes that are genuinely uncertain -- report-only, nightly only).
      # Also gates the committed real-data evaluation artifacts
      # (tests/test_committed_artifacts.py): headline numbers the site quotes,
      # a reduced-scale regeneration smoke on the packaged data, and a
      # code-hash staleness check that reds the build if evaluation code
      # changes without regenerating results/*.json (each runner takes
      # seconds -- re-run it and commit). Cheap enough (~3 s) to sit in this
      # per-PR hard gate rather than the nightly job.
      - name: Fast structural + stress tests
        run: uv run pytest -q -m "not calibration and not slow"

  slow-validation:
    name: Slow validation (high-draw, weighted) -- invariants HARD GATE
    # Only on manual dispatch or the nightly schedule -- never on PRs/pushes.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      # HARD GATE: the published invariants (zero/sign restrictions, FEVD
      # shares summing to 1, historical-decomposition reconstruction) re-checked
      # on the high-draw weighted config. These are exact identities, not
      # Monte-Carlo magnitudes, so drift here is a real bug and must red the
      # nightly build.
      - name: Slow published invariants -- HARD GATE
        run: uv run pytest -q --runslow -m "slow and not calibration"
      # REPORT ONLY: the weighted high-draw FEVD-share *magnitudes* are the
      # definitive calibration check, but benign Monte-Carlo drift must not red
      # the scheduled build.
      - name: Slow calibration magnitudes (non-gating)
        if: always()
        continue-on-error: true
        run: uv run pytest -q --runslow -m "slow and calibration"

  coverage-determinism:
    name: Coverage artefact reproduces at the committed seed (issue #26, ${{ matrix.os }} run ${{ matrix.run }})
    # Manual only. Reruns scripts/run_coverage_evaluation.py at the committed
    # configuration and fails if any coverage cell (levels or year on year)
    # differs from results/coverage_evaluation.json. It prints the numpy,
    # scipy, BLAS and CPU it ran on. Two runs per OS, because ubuntu-latest
    # lands on different CPU models and OpenBLAS picks kernels by CPU; with
    # the Cholesky shock factor every leg should pass. Each run uploads its
    # regenerated file.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        run: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Rerun the coverage evaluation and compare with the committed file
        run: uv run python scripts/check_coverage_determinism.py --save out/coverage_evaluation.json
      - name: Upload the regenerated file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.run }}
          path: out/coverage_evaluation.json

  artefacts-reproduce:
    name: Replication and forecast-revision artefacts reproduce (${{ matrix.os }})
    # Manual only. Regenerates results/summary.md (10,000 draws) and
    # results/forecast_summary.md (6,000 draws) at the committed settings and
    # fails if either differs from the committed file. Figures are not
    # compared (PNG bytes depend on the matplotlib build).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Regenerate the replication summary
        run: uv run python scripts/run_replication.py --draws 10000 --accepted 10000
      - name: Regenerate the forecast-revision summary
        run: uv run python scripts/run_forecast_revision.py --draws 6000
      # The adding-up identity's float residual (~1e-12) depends on the BLAS
      # build, so that one line is ignored; every other line must match.
      - name: Compare with the committed files
        run: git diff --exit-code -I 'max abs error across all draws' -- results/summary.md results/forecast_summary.md src/boe_var/_results/
      - name: Upload the regenerated summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summaries-${{ matrix.os }}
          path: |
            results/summary.md
            results/forecast_summary.md

  irf-reference:
    name: Impulse-response reference reproduces (issue #11, ${{ matrix.os }})
    # Manual only. Reruns scripts/run_irf_reference.py at the committed
    # settings (10,000 posterior draws) and fails if any median or band edge
    # in results/irf_reference.json differs by more than 1e-4. Each run
    # uploads its regenerated files.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Rerun the reference and compare with the committed file
        run: |
          mkdir -p out
          uv run python scripts/run_irf_reference.py --check --out-json out/irf_reference.json --out-md out/irf_vs_paper.md
      # Report only: the same run with one setting changed at a time, to
      # show what does and does not explain the gap to the paper's figures:
      # the paper's own sample end, a looser Minnesota prior (the marginal-
      # likelihood optimum) and two lags. Nothing is compared; the files are
      # uploaded.
      - name: Sensitivity runs
        if: always()
        run: |
          uv run python scripts/run_irf_reference.py --est-end 2023Q2 --out-json out/irf_reference_2023Q2.json --out-md out/irf_vs_paper_2023Q2.md
          uv run python scripts/run_irf_reference.py --lam 1.04 --out-json out/irf_reference_lam104.json --out-md out/irf_vs_paper_lam104.md
          uv run python scripts/run_irf_reference.py --lags 2 --out-json out/irf_reference_lags2.json --out-md out/irf_vs_paper_lags2.md
      - name: Upload the regenerated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irf-reference-${{ matrix.os }}
          path: out/
