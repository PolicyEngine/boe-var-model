name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual / nightly trigger for the expensive high-draw, importance-weighted
  # validation (the `slow` marker), which is skipped on every PR/push.
  workflow_dispatch:
  schedule:
    # Nightly, so drift in the heavy weighted validation is caught within a day
    # rather than up to a week later.
    - cron: "0 6 * * *"   # every day 06:00 UTC

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff check src tests

  tests:
    name: Fast tests (paper invariants + stress) -- HARD GATE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      # HARD GATE -- the paper-published invariants, which must never regress:
      #   1. zero restrictions hold on EVERY accepted draw
      #   2. sign restrictions hold on EVERY accepted draw
      #   3. FEVD shares sum to 1 (and each lies in [0, 1]) on EVERY draw
      #   4. the historical decomposition reconstructs the observed data on
      #      EVERY accepted draw
      #   plus the global FEVD shares sitting inside the paper's stated band,
      #   and the numerical stress suite (tests/test_stress.py).
      # Excludes only `slow` (the weighted high-draw *magnitude* benchmark,
      # re-run nightly in slow-validation) and `calibration` (Monte-Carlo
      # magnitudes that are genuinely uncertain -- report-only, nightly only).
      - name: Fast structural + stress tests
        run: uv run pytest -q -m "not calibration and not slow"

  slow-validation:
    name: Slow validation (high-draw, weighted) -- invariants HARD GATE
    # Only on manual dispatch or the nightly schedule -- never on PRs/pushes.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      # HARD GATE: the published invariants (zero/sign restrictions, FEVD
      # shares summing to 1, historical-decomposition reconstruction) re-checked
      # on the high-draw weighted config. These are exact identities, not
      # Monte-Carlo magnitudes, so drift here is a real bug and must red the
      # nightly build.
      - name: Slow published invariants -- HARD GATE
        run: uv run pytest -q --runslow -m "slow and not calibration"
      # REPORT ONLY: the weighted high-draw FEVD-share *magnitudes* are the
      # definitive calibration check, but benign Monte-Carlo drift must not red
      # the scheduled build.
      - name: Slow calibration magnitudes (non-gating)
        if: always()
        continue-on-error: true
        run: uv run pytest -q --runslow -m "slow and calibration"
